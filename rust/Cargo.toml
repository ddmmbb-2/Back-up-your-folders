[package]
name = "folder-versions"
version = "0.1.0"
edition = "2021"
authors = ["ddmmbb-2"]
description = "Offline whole-folder snapshot version manager"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.14"
walkdir = "2.5"
zip = { version = "2.4", default-features = false, features = ["deflate", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[package.metadata]
portable = true
